; ============================================================
; WUTHERING WAVES v3.7 - DeviceProfiles.ini
; Qualcomm / Adreno Mid-Tier - "Balanced-Visual+ v2.0"
; Tested on: LG V50S ThinQ 5G (Snapdragon 855 / Adreno 640)
; Repo: github.com/neljohn76/Wuwa-Experimental-Configs
; ============================================================
; How this works now (v3.6+ pattern):
;   1. Engine.ini sets dp.Override=Android_High, which forces this
;      profile for your device.
;   2. This section EXTENDS the game's stock "Android_High" profile
;      (BaseProfileName keeps the game's own defaults as the base).
;   3. DeviceScore=6969 unlocks the higher in-game resolution and
;      graphics preset range on the settings screen.
;
; Removed vs v2.7: r.Mobile.DeviceEvaluation, r.KuroFI.Enable,
; r.Streaming.PoolSize and friends are on Kuro's ConfigMonitor
; blacklist and were doing nothing.
; NOTE: sg.EffectsQuality=3 or higher can crash the game - capped at 2.
; ============================================================

[Android_High DeviceProfile]
BaseProfileName=Android_Low
DeviceScore=6969
CVars=r.Android.DisableVulkanSupport=0
CVars=r.Android.VulkanSetting=1
CVars=r.DontLimitOnBattery=1
CVars=r.Mobile.EnergySavingFrameInterpolation=0
CVars=r.Mobile.HighQualityMaterial=1
CVars=sg.ViewDistanceQuality=2
CVars=sg.AntiAliasingQuality=2
CVars=sg.ShadowQuality=3
CVars=sg.PostProcessQuality=3
CVars=sg.TextureQuality=4
CVars=sg.EffectsQuality=2
CVars=sg.FoliageQuality=2
CVars=sg.ShadingQuality=2