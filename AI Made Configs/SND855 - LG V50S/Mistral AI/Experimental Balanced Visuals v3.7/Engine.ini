; and do NOTHING since ~3.1-3.6): r.KuroFI.Enable,
; r.Mobile.DeviceEvaluation, r.Shadow.MaxResolution, r.ScreenPercentage,
; r.MipMapLODBias, r.ViewDistanceScale, r.Streaming.PoolSize, ...
