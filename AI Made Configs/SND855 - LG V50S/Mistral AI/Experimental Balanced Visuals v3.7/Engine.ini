; ============================================================
; WUTHERING WAVES v3.7 - Qualcomm / Adreno Mid-Tier Build
; "Balanced-Visual+ v2.0" - stable Lahai Roi traversal + visuals
; Tested on: LG V50S ThinQ 5G (Snapdragon 855 / Adreno 640)
; Base: Arglax Stable Mid-End (tested for v3.7.3) + visual lifts
; Repo: github.com/neljohn76/Wuwa-Experimental-Configs
