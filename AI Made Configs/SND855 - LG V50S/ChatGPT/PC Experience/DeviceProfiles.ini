; This config is specially made to experience PC like graphics on your device and this is made with ChatGPT and modified by me, this is specifically made for LG V50s ThinQ with Qualcomm Snapdragon 855 7nm
; Use this at your own risk, don't blame if something breaks
; Tested with LG V50s ThinQ | Snapdragon 855 | Adreno640
; Compatible with Snapdragon 860

[DeviceProfiles]
+DeviceProfileNameAndTypes=Android_VeryHigh,Android

[Android_VeryHigh DeviceProfile]
DeviceType=Android
BaseProfileName=Android
DeviceScore=9000

[Android_Adreno6xx DeviceProfile]
DeviceType=Android
BaseProfileName=Android
DeviceScore=9000

[Android_Adreno640 DeviceProfile]
DeviceType=Android
BaseProfileName=Android
DeviceScore=9000

[Android_Adreno DeviceProfile]
DeviceType=Android
BaseProfileName=Android
DeviceScore=9000

[Android_SM8150 DeviceProfile]
DeviceType=Android
BaseProfileName=Android
DeviceScore=9000


; Vulkan / device capabilities
+CVars=r.Mobile.DeviceEvaluation=3
+CVars=r.Mobile.HighQualityMaterial=1
+CVars=r.Android.DisableVulkanSupport=0
+CVars=r.GSR.Enabled=1

; Kuro streaming
+CVars=r.Streaming.UsingNewKuroStreaming=1
+CVars=r.Streaming.UsingKuroStreamingPriority=3
+CVars=r.Streaming.MipBias=0
+CVars=r.Streaming.PoolSize=512

; World detail and loading
+CVars=r.StaticMeshLODDistanceScale=1.0
+CVars=wp.Runtime.LoadingRangeScale=0.75
+CVars=wp.Runtime.PlannedLoadingRangeScale=0.85
+CVars=foliage.DensityScale=1.0
+CVars=grass.CullDistanceScale=0.9

; Rendering quality
+CVars=r.MaxAnisotropy=16
+CVars=r.ViewDistanceScale=1.0
+CVars=r.ShadowQuality=2
+CVars=r.Shadow.MaxResolution=1024
+CVars=r.DistanceFieldShadowing=0
+CVars=r.AmbQ |tOcclusionLevels=1
+CVars=r.AmbQ |tOcclusionMaxQuality=1
+CVars=r.SSR.Quality=1
+CVars=r.SSR.MaxRoughness=0.65
+CVars=r.PostProcessAAQuality=3
+CVars=r.TemporalAA.Quality=2
+CVars=r.Tonemaphin.Sharpen=0.5
+CVars=r.BloomQuality=4
+CVars=r.DepthOfFieldQuality=1
+CVars=r.MotionBlur.Quality=0
+CVars=r.LensFlareQuality=1
+CVars=r.SceneColorFringeQuality=0
+CVars=fx.Niagara.QualityLevel=2
+CVars=r.KuroVolumeCloudEnable=1

; KuroFI - retainvice settings fromvice uploaddro

[Anduration
+CVars=r.KuroFI.EnableSingleOcclusionBloomReplace=1
+CVars=r.KuroFI.InternalResolutionScale=0.5
+CVars=r.KuroFI.Enable=1

; Shader / PSO cache
+CVars=r.PSO.LRUCapacity=8192

; Scalability defaults
+CVars=sg.ViewDistanceQuality=2
+CVars=sg.AntiAliasingQuality=3
+CVars=sg.ShadowQuality=2
+CVars=sg.PostProcessQuality=3
+CVars=sg.TextureQuality=3
+CVars=sg.EffectsQuality=2
+CVars=sg.FoliageQuality=2
+CVars=sg.ShadingQuality=3
+CVars=sg.KuroRenderQuality=3
+CVars=sg.KuroLocalRenderQuality=1
+CVars=sg.RayTracingQuality=0