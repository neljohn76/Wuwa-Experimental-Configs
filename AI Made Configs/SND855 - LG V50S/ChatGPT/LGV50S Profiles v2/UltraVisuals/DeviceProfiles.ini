; Device profile name intentionally uses Android_VeryHigh.
; Do not replace with a custom Android_SND855 profile.
; Merge only if this section exists in your current DeviceProfiles.ini.
; Higher memory pool is experimental; reduce if textures hitch or memory pressure rises.

[Android_VeryHigh DeviceProfile]
+CVars=r.MobileContentScaleFactor=1.0
+CVars=r.Streaming.PoolSize=768
+CVars=r.MaxAnisotropy=8
+CVars=r.ShadowQuality=3
+CVars=r.SSR.Quality=2
+CVars=r.AmbientOcclusionLevels=2
