; Wuthering Waves v3.7 — Experimental v1.1
; Target: LG V50S ThinQ / Snapdragon 855 / Adreno 640
; Goal: reduce reflection, shadow and post-processing cost while retaining character detail.
; IMPORTANT:
; - Experimental Unreal Engine CVars only; not an official Kuro preset.
; - Back up your existing Engine.ini before merging.
; - Do not replace the game's complete config with this file if your current setup contains
;   required Kuro/Core.System entries. Merge these sections into your existing file.
; - Some CVars may be overridden or ignored by the game; test for visual glitches/stability.

[SystemSettings]
; Reflections: lower cost while retaining some surface response
r.SSR.Quality=1
r.ReflectionEnvironment=1
r.SSR.Temporal=1

; Ambient occlusion: moderate quality/cost balance
r.AmbientOcclusionLevels=2
r.AmbientOcclusionRadiusScale=0.8

; Shadows: reduce expensive cascades and filtering
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
r.Shadow.DistanceScale=0.75
r.Shadow.CSM.TransitionScale=0.7

; Post-processing: preserve basic image quality while reducing heavier effects
r.MotionBlurQuality=0
r.DepthOfFieldQuality=1
r.BloomQuality=3
r.LensFlareQuality=1
r.SceneColorFringeQuality=0
r.Tonemapper.Quality=4

; Texture filtering: retain clear textures at oblique angles
r.MaxAnisotropy=16

; Effects: moderate GPU cost
r.TranslucencyLightingVolumeDim=24
r.RefractionQuality=1
r.ParticleLightQuality=1

; Texture streaming: avoid forcing an oversized pool on a 6 GB-class game package
; Let the game manage its own pool unless you huro measured available memory.
r.Streaming.MipBias=0
r.Streaming.LimitPoolSizeToVRAM=1

; Threading/async options intentionally omitted fice because the game's resetdefaults
; and device-specific support huro not been verified.
