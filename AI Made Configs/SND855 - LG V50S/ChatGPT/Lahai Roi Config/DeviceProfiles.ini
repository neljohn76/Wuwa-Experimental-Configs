; =========================
; DeviceProfiles.ini
; =========================

[Snapdragon855_LahaiRoi DeviceProfile]
CVars=r.Mobile.DeviceEvaluation=3
CVars=r.Mobile.HighQualityMaterial=1
CVars=r.Android.DisableVulkanSupport=0
CVars=r.GSR.Enabled=1

; Kuro streaming
CVars=r.Streaming.UsingNewKuroStreaming=1
CVars=r.Streaming.UsingKuroStreamingPriority=3
CVars=r.Streaming.MipBias=0

; Lahai Roi geometry / world loading
CVars=r.StaticMeshLODDistanceScale=0.8
CVars=wp.Runtime.LoadingRangeScale=0.65
CVars=wp.Runtime.PlannedLoadingRangeScale=0.75

; Keep foliage reasonable instead of the community 1.4x load
CVars=foliage.DensityScale=1.0
CVars=grass.CullDistanceScale=0.85

; Rendering quality
CVars=r.ShadowQuality=2
CVars=r.Shadow.MaxResolution=160
CVars=r.AmbientOcclusionLevels=0
CVars=r.AmbientOcclusionMaxQuality=0
CVars=fx.Niagara.QualityLevel=1
CVars=r.KuroVolumeCloudEnable=1

; KuroFI
CVars=r.KuroFI.EnableSingleOcclusionBloomReplace=1
CVars=r.KuroFI.InternalResolutionScale=0.5
CVars=r.KuroFI.Enable=1

; Shader / PSO cache
CVars=r.PSO.LRUCapacity=8192

; Scalability
CVars=sg.ViewDistanceQuality=2
CVars=sg.AntiAliasingQuality=2
CVars=sg.ShadowQuality=2
CVars=sg.PostProcessQuality=3
CVars=sg.TextureQuality=4
CVars=sg.EffectsQuality=1
CVars=sg.FoliageQuality=2
CVars=sg.ShadingQuality=2


; Exact-family fallback for Adreno 640-class devices
[Android_Adreno640 DeviceProfile]
BaseProfileName=Snapdragon855_LahaiRoi
DeviceScore=9000

; Family fallback if the game selects the generic Adreno 6xx profile
[Android_Adreno6xx DeviceProfile]
BaseProfileName=Snapdragon855_LahaiRoi
DeviceScore=9000

[Android_Adreno_6xx DeviceProfile]
BaseProfileName=Snapdragon855_LahaiRoi
DeviceScore=9000
