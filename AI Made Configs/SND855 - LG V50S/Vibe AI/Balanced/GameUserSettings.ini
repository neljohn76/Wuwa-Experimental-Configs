; =====================================================================
;  WUTHERING WAVES v3.7 (LAHAI ROI) - Vibe AI "Balanced" Tier
;  FILE 3/3: GameUserSettings.ini
;  TARGET: LG V50S ThinQ 5G - Snapdragon 855 / Adreno 640 / 60 Hz OLED
; =====================================================================
;
;  >> WHY THIS CONFIG WAS MADE <<
;  Mirrors the Balanced tier's scalability groups so the settings UI
;  and the engine agree at launch. On mobile WuWa the FINAL sg.* value
;  comes from the DeviceProfiles.ini profile - this file keeps the
;  in-game menu from re-negotiating quality when you tweak other
;  settings. Frame limiter pinned to 60 to match the panel.
;
;  >> WARNINGS <<
;  1. sg.EffectsQuality=2 ON PURPOSE - 3+ CRASHES on Adreno 640.
;  2. Moving quality sliders in-game may rewrite these entries.
;     Re-align with the profile afterwards if you do.
;
;  Tested device : LG V50S ThinQ 5G (SD855 / Adreno 640, 60 Hz OLED)
;  Game version  : Wuthering Waves v3.7 (Lahai Roi)
;  Config made by: Nel John Acosta (built with Vibe AI)
; =====================================================================

[/Script/Engine.GameUserSettings]
bUseVSync=True
bUseDesktopResolutionForFullscreen=False
FullscreenMode=1
PreferredFullscreenMode=1
FrameRateLimit=60.000000
LastConfirmedFrameRateLimit=60.000000
ResolutionSizeX=3120
ResolutionSizeY=1440
LastUserConfirmedResolutionSizeX=3120
LastUserConfirmedResolutionSizeY=1440
DesiredScreenWidth=3120
DesiredScreenHeight=1440
LastUserConfirmedDesiredScreenWidth=3120
LastUserConfirmedDesiredScreenHeight=1440
AudioQualityLevel=0

[ScalabilityGroups]
; ---- Mirror of the Balanced DeviceProfiles profile ----
sg.ViewDistanceQuality=2
sg.AntiAliasingQuality=2
sg.ShadowQuality=3
sg.PostProcessQuality=3
sg.TextureQuality=4
sg.EffectsQuality=2
sg.FoliageQuality=2
sg.ShadingQuality=2
