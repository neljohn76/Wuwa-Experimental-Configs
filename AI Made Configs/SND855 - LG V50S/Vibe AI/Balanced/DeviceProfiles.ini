; =====================================================================
;  WUTHERING WAVES v3.7 (LAHAI ROI) - Vibe AI "Balanced" Tier
;  FILE 1/3: DeviceProfiles.ini
;  TARGET: LG V50S ThinQ 5G - Snapdragon 855 / Adreno 640 / 60 Hz OLED
; =====================================================================
;
;  >> WHY THIS CONFIG WAS MADE <<
;  The all-rounder: stable 60 FPS with a noticeably upgraded image
;  (proper shadows, water reflections, light shafts, volume clouds)
;  without pushing the Adreno 640 into throttling. This is the tier
;  to daily-drive if you play both overworld and endgame tower/combat
;  content. Part of the Vibe AI tier family:
;     Performance < Balanced (this) < Visual
;  Written from scratch. NOT based on Arglax's Mobile-WuWa-Config.
;
;  >> WARNINGS <<
;  1. EXPERIMENTAL. Always back up your original .ini files first.
;  2. sg.EffectsQuality is CAPPED AT 2 - value 3+ CRASHES the game on
;     Adreno 640. Do not raise it in any tier.
;  3. This file contains NO CVars from Kuro's ConfigMonitor blacklist.
;     Blacklisted CVars are stripped at runtime and do nothing.
;  4. Engine.ini must be installed together with this file - it sets
;     dp.Override=Android_High which activates this profile.
;
;  >> HOW IT WORKS (v3.6+ pattern) <<
;  1. Engine.ini sets dp.Override=Android_High -> forces this profile.
;  2. This section pins every scalability group explicitly.
;  3. DeviceScore=6969 unlocks the full preset range in-game.
;
;  Tested device : LG V50S ThinQ 5G (SD855 / Adreno 640, 60 Hz OLED)
;  Game version  : Wuthering Waves v3.7 (Lahai Roi)
;  Config made by: Nel John Acosta (built with Vibe AI)
;  Repo          : github.com/neljohn76/Wuwa-Experimental-Configs
; =====================================================================

[Android_High DeviceProfile]
; Inherit the mobile baseline, then pin everything ourselves
BaseProfileName=Android_Low
; Fake device score -> unlocks high preset range in-game
DeviceScore=6969

; ---- Platform / API (Vulkan, tuned for Adreno 640) ----
CVars=r.Android.DisableVulkanSupport=0
CVars=r.Android.VulkanSetting=1
CVars=r.Android.DisableVulkanSM5Support=1
CVars=r.Vulkan.Depth24Bit=1
CVars=r.Vulkan.RobustBufferAccess=0
CVars=r.Vulkan.RobustImageAccess=0

; ---- Anti-throttling: never let the game fake a 30 fps cap ----
CVars=r.DontLimitOnBattery=1
CVars=r.Mobile.EnergySavingFrameInterpolation=0
CVars=r.Kuro.AutoCoolEnable=0

; ---- Materials ----
CVars=r.Mobile.HighQualityMaterial=1

; ============================================================
;  SCALABILITY GROUPS - the stable tested ceiling for the 640
; ============================================================
CVars=sg.ViewDistanceQuality=2
CVars=sg.AntiAliasingQuality=2
CVars=sg.ShadowQuality=3
CVars=sg.PostProcessQuality=3
CVars=sg.TextureQuality=4
CVars=sg.EffectsQuality=2
CVars=sg.FoliageQuality=2
CVars=sg.ShadingQuality=2
