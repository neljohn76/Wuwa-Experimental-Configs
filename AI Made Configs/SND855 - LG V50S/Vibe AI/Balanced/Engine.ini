; =====================================================================
;  WUTHERING WAVES v3.7 (LAHAI ROI) - Vibe AI "Balanced" Tier
;  FILE 2/3: Engine.ini
;  TARGET: LG V50S ThinQ 5G - Snapdragon 855 / Adreno 640 / 60 Hz OLED
; =====================================================================
;
;  >> WHY THIS CONFIG WAS MADE <<
;  Fine-tuning layer for the Balanced DeviceProfiles preset. Keeps the
;  proven stability sections (GC, streaming, PSO cache, async FX,
;  occlusion batching) and enables the affordable visual lifts: light
;  shafts, volume clouds, scene-object + water SSR, cached 2-cascade
;  CSM with 256px per-object shadows, 8x anisotropy. Motion blur/DOF
;  stay OFF - they cost frames the 640 needs in combat.
;
;  >> WARNINGS <<
;  1. Zero ConfigMonitor-blacklisted CVars. Do not add them back.
;  2. If you hitch while traversing Lahai Roi: drop wp.Runtime ranges
;     to 0.45/0.60 and foliage culls to the Performance-tier values.
;  3. After a WuWa patch, shader cache rebuilds - expect one session
;     of stutters before judging this config.
;
;  Tested device : LG V50S ThinQ 5G (SD855 / Adreno 640, 60 Hz OLED)
;  Game version  : Wuthering Waves v3.7 (Lahai Roi)
;  Config made by: Nel John Acosta (built with Vibe AI)
; =====================================================================

[Core.Log]
LogCsMobile=none
LogJson=none
LogTpMobile=none
Puerts=none

[PrecomputedVisibility/Runtime]
EnableNavPartition=1
r.AllowPrecomputedVisibility=1

[SystemSettings]
; Forces the tuned profile defined in DeviceProfiles.ini
dp.Override=Android_High

; Hard cap at the panel: even 60 fps frame pacing
t.MaxFPS=60

; ============================================================
;  ANIMATION / LOD
; ============================================================
a.URO.Enable=1
a.URO.ForceInterpolation=1
lod.TemporalLag=1

; ============================================================
;  GC / MEMORY / ASYNC LOADING - fewer hitches on 6 GB
; ============================================================
gc.ActorClusteringEnabled=1
gc.AllowParallelGC=1
gc.IncrementalBeginDestroyEnabled=1
gc.MultithreadedDestructionEnabled=1
gc.TimeBetweenPurgingPendingKillObjects=61.1
kuro.LowMemLevelMask=192
m.LowMemoryDeviceThreshold=5800
s.AsyncLoadingThreadEnabled=1
s.EventDrivenLoaderEnabled=1
s.LevelStreamingActorsUpdateTimeLimit=3.0
s.LevelStreamingComponentsRegistrationGranularity=8
s.LevelStreamingComponentsUnregistrationGranularity=5
s.MinBulkDataSizeForAsyncLoading=131072
s.UnregisterComponentsTimeLimit=0.8
s.UseBackgroundLevelStreaming=1
r.Streaming.AmortizeCPUToGPUCopy=1
r.Streaming.UsingNewKuroStreaming=1
r.TextureStreaming=1
r.Texture.KuroMobileWeightmapMip=1
wp.Runtime.BlockOnSlowStreamingRatio=0.5

; ============================================================
;  WORLD DRAW - tested stable ranges for mid-tier chips
;  FALLBACK: 0.45/0.60 if you hitch while traversing.
; ============================================================
wp.Runtime.LoadingRangeScale=0.55
wp.Runtime.PlannedLoadingRangeScale=0.75
r.Kuro.NpcDisappearDistance=1800
r.Landscape.KuroLOD0Distance=18000
r.LandscapeLOD0ScreenSizeScale=1.5
r.StaticMeshLODDistanceScale=1.0

; ============================================================
;  FOLIAGE - slightly denser than pure-performance, capped culls
;  FALLBACK: far 7000/6500, grass 1500 (Performance values).
; ============================================================
foliage.DensityScale=0.9
foliage.LODDistanceScale=1.0
foliage.LODOptimize=1
grass.CullDistanceScale=0.9
grass.DensityScale=0.9
r.Kuro.Foliage.EnableFoliageCulling=1
r.Kuro.Foliage.MobileFarCullDistanceMax=8500
r.Kuro.Foliage.MobileFarCullDistanceMin=8000
r.Kuro.Foliage.MobileMiddleCullDistanceMax=5000
r.Kuro.Foliage.MobileMiddleCullDistanceMin=4000
r.Kuro.Foliage.MobileNearCullDistanceMax=3000
r.Kuro.Foliage.MobileGrassCullDistanceMax=2200
r.Kuro.Foliage.MobileGrass3_0CullDistanceMax=2200

; ============================================================
;  KURO RENDERING FEATURES - affordable visual signatures ON
; ============================================================
r.Kuro.KuroBloomStreak=1
r.Kuro.KuroToonFFTHighQuality=1
r.Kuro.InteractionEffect.UseCppWaterEffect=1
r.KuroDownsampleTranslucency=1
r.KuroDownsampleTranslucencyMode=1
r.KuroVolumeCloudEnable=1
Kuro.Blueprint.EnableGameBudget=1

; ============================================================
;  OCCLUSION / CULLING
; ============================================================
r.AllowHardwareOcclusion=1
r.AllowOcclusionQueries=1
r.AllowSoftwareOcclusion=0
r.CullDistanceVolume.Enable=1
r.FogVisibilityCulling.Enable=1
r.FogVisibilityCulling.Opacity=0.1
HISMBatcher.Enabled=1
r.imp.enable=1
r.imp.UpdateBatch=32
r.ImposterVer2.Enabled=1
UBInstancing.Enabled=1
UBInstancing.EnabledDepth=1
UBInstancing.EnabledShaders=1
UBInstancing.EnabledShadow=0
r.MDCFallback.Enabled=1
r.MDCFallback.EnabledLOD=1
r.Mobile.AllowDitheredLODTransition=0
r.MinScreenRadiusForCSMDepth=0.01
r.MinScreenRadiusForLights=0.03
r.MeshDrawCommands.DirectionalShadowPerBatchDrawcallMax0=160
r.MeshDrawCommands.DirectionalShadowPerBatchDrawcallMax1=160
r.MeshDrawCommands.DirectionalShadowPerBatchDrawcallMax2=140
r.MeshDrawCommands.ShadowPerBatchDrawcallMax=160

; ============================================================
;  LIGHTING / LIGHT SHAFTS - PC-style god rays, modest samples
; ============================================================
r.AmbientOcclusionMaxQuality=100
r.AmbientOcclusionMipLevelFactor=1.0
r.AmbientOcclusionRadiusScale=1.0
r.MobileNumDynamicPointLights=2
r.MobileVolumetricFog.ShadingRate=0
r.SkyAtmosphere.SampleCountMax=32.0
r.TyndallScatteringQuality=0
r.MobileLightShaft=1
r.MobileLightShaft.AllowTAA=1
r.MobileLightShaft.BloomScale=0.7
r.MobileLightShaft.DownSampleFactor=2.0
r.MobileLightShaft.NumSamples=4
r.MobileLightShaft.UseLocalLightShaft=0
r.LightShaftBlurPasses=1
r.LightShaftNumSamples=4

; ============================================================
;  SHADOWS - cached 2-cascade CSM + 256px per-object
;  (r.Shadow.MaxResolution / DistanceScale are blacklisted; quality
;   comes from sg.ShadowQuality + these CVars.)
;  FALLBACK: sg.ShadowQuality 3->2 in DeviceProfiles.ini.
; ============================================================
r.Shadow.CSM.MaxCascades=2
r.Shadow.CSM0ShadowPCFQuality=2
r.Shadow.CSM1ShadowPCFQuality=1
r.Shadow.CSM2ShadowPCFQuality=0
r.Shadow.DirectCSMStableMaxIndex=1
r.Shadow.UseStaticCSM0Cache=1
r.Shadow.CacheDirectLightShadow=3
r.Shadow.CacheMode3CacheUpdateIntervals=17,19,59,139
r.Shadow.DirectLightCacheNeedOriginChange=50,150,500,700,900,5000
r.Shadow.FarShadowDistanceOverride=0
r.Shadow.MaxNumFarShadowCascades=0
r.Shadow.ForbidHISMShadowStartIndex=2
r.Shadow.KuroEnablePointLightShadow=0
r.Shadow.PerObjectResolutionMax=256
r.Shadow.PerObjectResolutionMin=64
r.Shadow.PerObjectShadowCulling=1
r.Shadow.PerObjectShadowMapResolution=256
r.Shadow.PerObjShadowPCFQuality=2
r.Shadow.PreShadowResolutionFactor=0.5
r.Shadow.RadiusThreshold=0.025
r.Shadow.RadiusThresholdCSM0=0.15
r.Shadow.RadiusThresholdCSM1=0.3
r.Shadow.RadiusThresholdOverrideEnable=0
r.Shadow.SkeletalMeshLODBias=3
r.ShadowMask.Scale=0.5
r.Shadow.AllShadowDrawcallMax=400
r.CapsuleShadows=0
r.Mobile.EnableKuroSpotlightsShadow=0

; ============================================================
;  REFLECTIONS & WATER - scene-object SSR + water reflections ON
; ============================================================
r.SSR.Quality=1
r.SSR.MaxRoughness=0.5
r.SSR.Temporal=1
r.SSR.HalfResSceneColor=1
r.Mobile.SceneObjMobileSSR=1
r.Mobile.EnableWaterReflection=1
r.Mobile.WaterSSR=1
r.Mobile.WaterSSRStep=32
r.ReflectionEnvironment=1
r.ReflectionEnvironmentLightmapMixBasedOnRoughness=1
r.ReflectionCaptureResolution=64
r.Kuro.EnablePlanarReflection=0
r.SSGI.Enable=0
r.SSFS.DownSampleFator=2
r.SSFS.FullPrecision=0
r.SSFS.HighQuality=0
r.SSFS.PassAmount=8

; ============================================================
;  POST-PROCESS - clean image, motion blur/DOF OFF for fps
; ============================================================
r.DefaultFeature.MotionBlur=0
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.DOF.Gather.AccumulatorQuality=0
r.DOF.Gather.RingCount=3
r.DOF.Scatter.ForegroundCompositing=0
r.DOF.TemporalAAQuality=0
r.BloomQuality=1
r.LensFlareQuality=0
r.FastBlurThreshold=20
r.Filter.SizeScale=1.0
r.MaxAnisotropy=8
r.MobileMSAA=1
r.TranslucencyLightingVolumeDim=32
r.SSS.HalfRes=1
r.SSS.SampleSet=1
r.Tonemapper.Quality=2
r.Tonemapper.Sharpen=1.0
r.TonemapperGamma=2.2
r.SceneColorFormat=4
r.SceneColorFringeQuality=0
r.TemporalAA.MobileFrameWeight=0.2
r.TemporalAACatmullRom=1
r.TemporalAAFilterSize=0.5
r.TemporalAASamples=8
r.Upscale.Quality=3
r.VRS.MobileTranslucent=1

; ============================================================
;  FX - async particle tick for combat pacing
; ============================================================
FX.AllowAsyncTick=1
fx.BatchAsync=1
fx.BatchAsyncBatchSize=128
fx.EarlyScheduleAsync=1
fx.KuroUseGPUParticles=0
fx.Niagara.PerEmitterCull=1
fx.Niagara.QualityLevel=1
Niagara.GPUCulling=1
r.EmitterSpawnRateScale=0.5

; ============================================================
;  VULKAN / PLATFORM - Adreno 640 specifics
; ============================================================
r.Android.DisableVulkanSupport=0
r.Android.DisableVulkanSM5Support=1
r.Android.VulkanSetting=1
r.Vulkan.Depth24Bit=1
r.Vulkan.DescriptorSetLayoutMode=2
r.Vulkan.DisablePacing=1
r.Vulkan.DisableSubpassDeferred=1
r.Vulkan.EnableTileHeap=0
r.Vulkan.RobustBufferAccess=0
r.Vulkan.RobustImageAccess=0
r.Vulkan.Robustness2=0
r.DefaultBackBufferPixelFormat=0
r.Mobile.EnergySavingFrameInterpolation=0
r.DontLimitOnBattery=1
r.Kuro.AutoCoolEnable=0
r.VSync=1

; ============================================================
;  PSO / SHADER PIPELINE CACHE
; ============================================================
r.ShaderPipelineCache.Enabled=1
r.ShaderPipelineCache.ForegroundStagedBatching=1
r.ShaderPipelineCache.PrecompileCheckCacheHash=1
r.ShaderPipelineCache.SaveUserCache=1
r.ShaderPipelines=1

[CrashReportClient]
bSendUnattendedBugReports=0
bAgreeToCrashUpload=0
bImplicitSend=0
bAllowToBeContacted=0
bSendLogFile=0
bSendDumpLog=0
bSendReport=0
