; =====================================================================
; Wuthering Waves - DeviceProfiles.ini
; Target: LG V50S ThinQ / Snapdragon 855 (Adreno 640)
; Pairs with the Engine.ini from this set. Values here set the
; device-level scalability defaults; Engine.ini overrides them.
; =====================================================================

[DeviceProfiles]
+DeviceProfileNameAndTypes=Android,Android
+DeviceProfileNameAndTypes=Android_Adreno6xx,Android
+DeviceProfileNameAndTypes=Android_Low,Android
+DeviceProfileNameAndTypes=Android_Mid,Android
+DeviceProfileNameAndTypes=Android_High,Android

[Android DeviceProfile]
DeviceType=Android
BaseProfileName=
+CVars=r.MobileContentScaleFactor=0
+CVars=t.MaxFPS=45
+CVars=r.Streaming.PoolSize=700
+CVars=r.MaxAnisotropy=4

[Android_Adreno6xx DeviceProfile]
DeviceType=Android
BaseProfileName=Android
+CVars=r.ScreenPercentage=80
+CVars=r.ViewDistanceScale=0.75
+CVars=r.Shadow.MaxResolution=1024
+CVars=r.Shadow.MaxCSMResolution=1024
+CVars=r.Shadow.DistanceScale=0.7
+CVars=r.Shadow.CSM.MaxCascades=2
+CVars=foliage.DensityScale=0.6
+CVars=grass.DensityScale=0.5
+CVars=r.MotionBlurQuality=0
+CVars=r.DepthOfFieldQuality=0
+CVars=r.AmbientOcclusionLevels=0
+CVars=r.SSR.Quality=0
+CVars=r.BloomQuality=2
+CVars=r.PostProcessAAQuality=3
+CVars=r.EffectsQuality=1
+CVars=r.Mobile.DisableVertexFog=1

[Android_Low DeviceProfile]
DeviceType=Android
BaseProfileName=Android_Adreno6xx
+CVars=r.ScreenPercentage=70

[Android_Mid DeviceProfile]
DeviceType=Android
BaseProfileName=Android_Adreno6xx

[Android_High DeviceProfile]
DeviceType=Android
BaseProfileName=Android_Adreno6xx
+CVars=r.ScreenPercentage=85
