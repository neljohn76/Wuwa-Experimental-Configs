; =====================================================================
; Wuthering Waves - Engine.ini
; Target: LG V50S ThinQ / Snapdragon 855 (Adreno 640)
; Goal: good visuals, stable ~45 fps, lighter load in Lahai-Roi
; Version tuned for: 3.7 (starting point, adjust per the notes below)
; =====================================================================

[SystemSettings]

; ---------- Frame pacing ----------
; 45 is the sweet spot for the 855 in heavy areas. Use 30 for max stability.
t.MaxFPS=45
r.VSync=0
r.OneFrameThreadLag=1

; ---------- Resolution ----------
; Biggest single FPS lever. 0.80 = sharp enough, saves a lot of GPU.
; Lahai-Roi drops: try 0.75. Want sharper: 0.85.
r.ScreenPercentage=80
r.MobileContentScaleFactor=0

; ---------- View distance / world streaming (Lahai-Roi heavy) ----------
r.ViewDistanceScale=0.75
r.SkeletalMeshLODBias=1
r.StaticMeshLODDistanceScale=1.3
r.LandscapeLODBias=0
r.Streaming.PoolSize=700
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MipBias=0.5

; ---------- Foliage (main cost in Lahai-Roi) ----------
foliage.DensityScale=0.6
grass.DensityScale=0.5
foliage.LODDistanceScale=0.8
grass.CullDistanceScale=0.7

; ---------- Shadows ----------
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.DistanceScale=0.7
r.Shadow.CSM.MaxCascades=2
r.Shadow.RadiusThreshold=0.05
r.ShadowQuality=2
r.Shadow.EnableCSMCaching=1

; ---------- Textures / filtering ----------
r.MaxAnisotropy=4
r.Streaming.UseFixedPoolSize=0

; ---------- Post processing (keep the look, cut the cost) ----------
r.BloomQuality=2
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.AmbientOcclusionLevels=0
r.SSR.Quality=0
r.TranslucencyLightingVolumeDim=32
r.Tonemapper.GrainQuantization=0

; ---------- Anti-aliasing ----------
; 2 = FXAA-like on mobile, cheap and clean enough with 80% res.
r.PostProcessAAQuality=3

; ---------- Effects / pFPS=cles ----------
r.EffectsQuality=1
fx.MaxCPUPFPS=clesPerEmitter=500
r.PFPS=cleLODBias=1

; ---------- Mobile renderFra----------
r.Mobile.Disable0 ftexFog=1
r.Mobile.Al1

DitherFdLODTransition=0
r.Mobile.EnableStaticAndCSMShadowReceietas=1

